/* العارض الميداني — صفحة ثابتة بلا بيانات. بيانات المهمة تأتي في جزء الرابط بعد «#» من رمز QR، مشفّرة، ولا تُرسَل إلى أي خادم.
   التصميم: رماديات Blueprint الداكنة (Palantir — Apache-2.0)، أزرق للإجراء الرئيسي، برتقالي للتنبيه، أحمر للسرية والخطر. */
:root { --bg: #1C2127; --s1: #252A31; --s2: #2F343C; --ln: #383E47; --tx: #F6F7F9; --t2: #ABB3BF; --t3: #8F99A8; --pri: #2D72D2; --pri2: #4C90F0; --ok: #32A467; --warn: #EC9A3C; --err: #E76A6E; --cls: #AC2F33; --nai: #4C90F0; --tai: #E76A6E; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font-family: "IBM Plex Sans Arabic", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.55; }
body { display: flex; flex-direction: column; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
button, input, textarea { font: inherit; color: inherit; }
.cls { background: var(--cls); color: #fff; text-align: center; font-weight: 700; font-size: 12px; padding: calc(2px + env(safe-area-inset-top)) 0 2px; }
header { padding: 10px 14px 8px; background: var(--s1); border-bottom: 1px solid var(--ln); }
header .t { display: flex; align-items: center; gap: 8px; } header h1 { font-size: 17px; margin: 0; flex: 1; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12.5px; font-weight: 700; color: #fff; }
.cd { margin-top: 6px; display: flex; justify-content: space-between; font-size: 13px; color: var(--t2); } .cd b { color: var(--tx); font-variant-numeric: tabular-nums; }
.cd .live b { color: var(--ok); } .cd .soon b { color: var(--warn); }
main { flex: 1; overflow: auto; padding: 12px 12px 90px; }
nav.tabs { position: fixed; bottom: 0; inset-inline: 0; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--s1); border-top: 1px solid var(--ln); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav.tabs button { background: none; border: 0; padding: 7px 1px 8px; color: var(--t3); font-size: 11px; display: grid; justify-items: center; gap: 2px; }
nav.tabs button.on { color: var(--pri2); } nav.tabs svg { width: 22px; height: 22px; }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card { background: var(--s1); border: 1px solid var(--ln); border-radius: 4px; padding: 10px 12px; margin-bottom: 10px; }
.card h2 { font-size: 15px; margin: 0 0 6px; } .card h3 { font-size: 14px; margin: 8px 0 4px; color: var(--t2); }
.muted { color: var(--t3); font-size: 13px; } .small { font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: baseline; } .row .grow { flex: 1; }
.it { border-top: 1px solid var(--ln); padding: 8px 0; } .it:first-of-type { border-top: 0; }
.it .k { font-weight: 700; } .tm { font-variant-numeric: tabular-nums; color: var(--t2); font-size: 13px; white-space: nowrap; direction: ltr; }
.now { background: rgba(45,114,210,.12); border-inline-start: 3px solid var(--pri); padding-inline-start: 8px; margin-inline-start: -11px; }
.done { opacity: .55; }
.tag { display: inline-block; font-size: 11.5px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--ln); color: var(--t2); margin-inline-start: 4px; }
.tag.tai { border-color: var(--tai); color: var(--tai); } .tag.nai { border-color: var(--nai); color: var(--nai); }
.btn { background: var(--s2); border: 1px solid var(--ln); border-radius: 4px; padding: 8px 12px; min-height: 40px; }
.btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 700; } .btn.full { width: 100%; }
.warnbox { border: 1px solid rgba(200,118,25,.5); background: rgba(200,118,25,.1); color: #FBB360; border-radius: 4px; padding: 8px 10px; font-size: 13.5px; }
.errbox { border: 1px solid rgba(205,66,70,.55); background: rgba(205,66,70,.12); color: #FA999C; border-radius: 4px; padding: 8px 10px; font-size: 13.5px; }
input.code { width: 100%; text-align: center; font-size: 26px; letter-spacing: 4px; padding: 10px; background: #111418; border: 1px solid var(--ln); border-radius: 4px; direction: ltr; text-transform: uppercase; font-variant-numeric: tabular-nums; }
input.code:focus, textarea:focus { outline: none; border-color: var(--pri2); box-shadow: 0 0 0 1px var(--pri2); }
textarea { width: 100%; min-height: 190px; line-height: 1.7; background: #111418; border: 1px solid var(--ln); border-radius: 4px; padding: 8px; }
.center { max-width: 420px; margin: 0 auto; padding-top: 6vh; text-align: center; } .center img { width: 84px; border-radius: 50%; }
.brand { font-size: 26px; font-weight: 700; } .brand em { font-style: normal; font-weight: 400; font-size: 14px; letter-spacing: 4px; color: var(--t2); margin-inline-start: 6px; }
#map { position: relative; height: calc(100dvh - 300px); min-height: 320px; background: #111418; border: 1px solid var(--ln); border-radius: 4px; overflow: hidden; touch-action: none; }
#map svg { width: 100%; height: 100%; display: block; }

    const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2; VB = [cx - w / 2, cy - h / 2, w, h]; };

      if (SEL) { const f = F.find(z => z.id === SEL); if (f) { const [a, b] = proj(f.g[0], f.g[1]); h += `<line x1="${x}" y1="${y}" x2="${a}" y2="${b}" stroke="#F6F7F9" stroke-width="${sw}" stroke-dasharray="${s * 4} ${s * 4}"/>`; } } }

    h += `<text class="lbl" x="${VB[0] + VB[2] - s * 16}" y="${VB[1] + s * 22}" text-anchor="middle" font-size="${fs * 1.2}" style="stroke-width:${s * 3}px;direction:ltr">↑N</text>`;

    if (SATON) { const r = $("#msvg").getBoundingClientRect(), k = Math.max(VB[2] / r.width, VB[3] / r.height) || 1, w = r.width * k, hh = r.height * k, cx = VB[0] + VB[2] / 2, cy = VB[1] + VB[3] / 2;
      const [la1, lo1] = unproj(cx - w / 2, cy - hh / 2), [la2, lo2] = unproj(cx + w / 2, cy + hh / 2); let z = zFor(k / (window.devicePixelRatio > 1 ? 1.5 : 1)), T = tileRange(la1, lo1, la2, lo2, z);
      while (T.length > 48 && z > 12) T = tileRange(la1, lo1, la2, lo2, --z);
      const key = T.map(t => t.join("/")).join(","); if (key !== BGKEY) { BGKEY = key; $("#bg").innerHTML = T.map(tileSVG).join(""); } }
    else if (BGKEY) { BGKEY = ""; $("#bg").innerHTML = ""; }
    document.querySelectorAll("[data-f]").forEach(c => c.onclick = () => { SEL = c.dataset.f; draw(); info(); });
  };
  const info = () => { const f = F.find(x => x.id === SEL);
    const who = f && PKG && PKG.v === 2 ? [f.ag, ...(f.cord ? [f.cord[2], f.cord[3]] : [])].map((a, j) => [a, j]).filter(([a]) => a != null && (a >= 0 || a === -2)).map(([a, j]) => `<span class="tag" style="border-color:${esc(agOf(a)[2])}">${f.cord ? ["تنفيذ: ", "طوق داخلي: ", "طوق خارجي: "][j] : ""}${esc(agOf(a)[1])}</span>`).join("") : "";
    $("#minfo").innerHTML = (f ? `<div class="row"><b>${esc(f.n)}</b><span class="grow">${esc(f.d)}</span></div>${who ? `<div style="margin-top:4px">${who}</div>` : ""}<div class="small muted" dir="ltr" style="text-align:end">${fmtLL(f.g[0], f.g[1])}</div>` : `<div class="small muted">اضغط على منطقة لعرضها، وفعّل «موقعي» لمعرفة المسافة والاتجاه إليها.</div>`)
      + (GPS ? `<div class="gps">موقعي: <span dir="ltr">${fmtLL(GPS.lat, GPS.lon)}</span> (±${Math.round(GPS.acc)} م)${f ? ` · المسافة: <b>${(d => d >= 1000 ? (d / 1000).toFixed(1) + " كم" : Math.round(d) + " م")(distM(GPS.lat, GPS.lon, f.g[0], f.g[1]))}</b> باتجاه <b>${dirAr(brg(GPS.lat, GPS.lon, f.g[0], f.g[1]))}</b> (${Math.round(brg(GPS.lat, GPS.lon, f.g[0], f.g[1]))}°)` : ""}</div>` : ""); };

  $("#sat").onclick = () => { SATON = !SATON; LS.set("mf.sat", SATON); vMap(); if (SATON) cacheArea(); };
  if (SATON) { const n = LS.get("mf.tiles", {})[PID]; $("#minfo").insertAdjacentHTML("afterend", `<p class="small muted" id="satst" style="margin:6px 2px 0">${n ? `الصورة الجوية محفوظة للعمل دون اتصال (${n} بلاطة).` : navigator.onLine ? "جارٍ حفظ الصورة الجوية لمنطقة العمليات…" : "الصورة الجوية تحتاج اتصالاً أول مرة."}</p>`); }
